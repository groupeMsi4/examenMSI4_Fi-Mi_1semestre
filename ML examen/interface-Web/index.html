<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpion Pro - IA & ML Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">
    <div class="div_tete"> 
        <span class="font-bold font-mono text-xl flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            Groupe Fi/Mi
        </span>
        <div id="gameModeDisplay" class="text-sm bg-gray-900 px-4 py-1 rounded-full font-medium">Mode: Sélection...</div>
        <div class="text-right pr-4">
            <p class="text-xs">ISPM Examen ML</p>
            <p class="text-xs font-bold">31 Mars 2026</p>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden flex-col md:flex-row">
        <aside class="w-full md:w-80 bg-white border-r border-gray-200 p-6 flex flex-col gap-6 overflow-y-auto">
            <fieldset class="border-2 border-blue-700 rounded-2xl p-4">
                <legend class="px-2 text-xs font-bold text-blue-600 uppercase tracking-widest">Tour actuel</legend>
                <div class="flex items-center justify-around py-2">
                    <div id="turnX" class="flex flex-col items-center p-2 rounded-xl transition-all duration-300 border-2 border-transparent">
                        <span class="text-2xl font-bold text-blue-500">X</span>
                        <span class="text-[10px] font-semibold text-gray-400">Joueur 1</span>
                    </div>
                    
                    <div class="h-8 w-px bg-gray-100"></div>
                    
                    <div id="turnO" class="flex flex-col items-center p-2 rounded-xl transition-all duration-300 border-2 border-transparent opacity-30">
                        <span class="text-2xl font-bold text-red-500">O</span>
                        <span id="labelO" class="text-[10px] font-semibold text-gray-400">Joueur 2</span>
                    </div>
                </div>
            </fieldset>

            <fieldset class="border-2 border-purple-700 rounded-2xl p-4">
                <legend class="px-2 text-xs font-bold text-purple-600 uppercase tracking-widest">Analyse IA (Predict)</legend>
                <div class="space-y-4 py-2">
                    <div>
                        <div class="flex justify-between text-xs mb-1 font-medium">
                            <span>Probabilité Victoire X</span>
                            <span id="probXText">--%</span>
                        </div>
                        <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                            <div id="probXBar" class="prob-bar bg-blue-500 h-full w-0"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs mb-1 font-medium">
                            <span>Probabilité Match Nul</span>
                            <span id="probDrawText">--%</span>
                        </div>
                        <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                            <div id="probDrawBar" class="prob-bar bg-gray-400 h-full w-0"></div>
                        </div>
                    </div>
                </div>
            </fieldset>

            <fieldset class="border-2 border-green-500 rounded-2xl p-4 flex-1 flex flex-col min-h-[200px]">
                <legend class="px-2 text-xs font-bold text-green-600 uppercase tracking-widest">Vecteur d'entrée ML</legend>
                <div id="datasetLog" class="text-[10px] font-mono text-gray-600 overflow-y-auto flex-1 mt-2">
                    <div class="opacity-50 italic">En attente du premier coup...</div>
                </div>
            </fieldset>
        </aside>

        <main class="flex-1 flex flex-col items-center justify-center p-4">
            <div class="bg-white p-6 md:p-10 rounded-[40px] shadow-2xl border border-gray-100 flex flex-col items-center w-full max-w-xl">
                <h2 id="status" class="text-2xl font-bold mb-8 text-gray-800 text-center uppercase tracking-tight">Choisissez un mode</h2>
                <div class="game-grid mb-10" id="grid">
                    <div class="cell" data-index="0"></div>
                    <div class="cell" data-index="1"></div>
                    <div class="cell" data-index="2"></div>
                    <div class="cell" data-index="3"></div>
                    <div class="cell" data-index="4"></div>
                    <div class="cell" data-index="5"></div>
                    <div class="cell" data-index="6"></div>
                    <div class="cell" data-index="7"></div>
                    <div class="cell" data-index="8"></div>
                </div>
                <button id="resetBtn" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold py-4 px-10 rounded-2xl transition-all border-2 border-blue-200">
                    NOUVELLE PARTIE
                </button>
            </div>
        </main>
    </div>

    <div id="modalOverlay" class="modal-overlay fixed inset-0 bg-gray-900/80 backdrop-blur-md z-50 items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-8 text-center max-w-sm w-full" id="modalBox">
            <h2 class="text-3xl font-black text-gray-800 mb-6 uppercase">Mode du jeu</h2>
            <p>Veuillez choisir le mode :</p>
            <br>
            <div class="space-y-4">
                <button onclick="startGame('h-vs-h')" class="w-full p-5 bg-gray-50 hover:bg-green-600 hover:text-white rounded-2xl font-bold transition-all border-2 border-indigo-200">
                    <span>HUMAIN vs HUMAIN</span><br><small class="font-mono">PVP</small>
                </button>
                <button onclick="startGame('h-vs-ia')" class="w-full p-5 bg-gray-50 hover:bg-green-600 hover:text-white rounded-2xl font-bold transition-all border-2 border-indigo-200">HUMAIN vs IA <br> <small class="font-mono">MINIMAX & ALPHABETA</small></button>
                <button onclick="startGame('h-vs-ml')" class="w-full p-5 bg-gray-50 hover:bg-green-600 hover:text-white rounded-2xl font-bold transition-all border-2 border-indigo-200">HUMAIN vs IA <br> <small class="font-mono">Machine Learning</small></button>
            </div>
        </div>
    </div>
    <script src="scrypt.js"></script>
</body>
</html>
